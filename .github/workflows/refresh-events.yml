name: Refresh Culture Scout events
on:
  schedule:
    - cron: '15 9 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: culture-scout-publish
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Research and validate event listings
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python scripts/update_events.py
      - name: Refresh illustrated HTML fallback
        run: node scripts/build-static.js
      - name: Publish only if changed
        run: |
          if git diff --quiet -- events.json index.html; then
            echo "No change to publish."
            exit 0
          fi
          git config user.name "culture-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json index.html
          git commit -m "Refresh verified Culture Scout event edition"
          git push

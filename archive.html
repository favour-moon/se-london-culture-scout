<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Culture Scout · Past events archive</title><style>body{font:16px/1.6 system-ui,sans-serif;background:#fff8eb;color:#23201d;max-width:850px;margin:auto;padding:24px}a{color:#9b4400}h1{font-size:2.5rem}article{border-bottom:1px solid #d8c4aa;padding:16px 0}small{color:#655c52}input{width:100%;padding:12px;font-size:1rem;border:1px solid #8b7860;border-radius:6px}</style><link rel="stylesheet" href="./event-media.css?v=12"><script src="./event-media.js?v=12"></script></head><body><a href="./index.html">← Back to current discoveries</a><h1>THE SCOUT'S ARCHIVE</h1><p>Only events whose final scheduled date has passed. Productions still running are kept on the main site.</p><input id="q" type="search" placeholder="Search past events…" aria-label="Search archive"><p id="count">Loading past events…</p><main id="list"></main><script>const date=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let past=[];function show(){const q=document.getElementById('q').value.toLowerCase();const a=past.filter(e=>[e.title,e.venue,e.area,e.category].join(' ').toLowerCase().includes(q));document.getElementById('count').textContent=a.length+' past events';document.getElementById('list').innerHTML=a.map(e=>'<article class="archive-event">'+ScoutMedia.html(e)+'<div><small>'+esc(e.date)+(e.endDate?' – '+esc(e.endDate):'')+'</small><h2>'+esc(e.title)+'</h2><p>'+esc(e.venue||'')+' · '+esc(e.area||'')+'</p>'+(e.url?'<a href="'+esc(e.url)+'" target="_blank" rel="noopener noreferrer">Original event page ↗</a>':'')+'</div></article>').join('')||'<p>No past events match.</p>'}Promise.all([fetch('./events.json',{cache:'no-store'}).then(r=>r.json()),fetch('./research-archive.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>({pastEvents:[]}))]).then(([d,archive])=>{const all=[...(d.events||[]),...(archive.pastEvents||[])];const ids=new Set();past=all.filter(e=>e.date&&(e.endDate||e.date)<date).filter(e=>{const id=e.title+'|'+e.date;if(ids.has(id))return false;ids.add(id);return true}).sort((a,b)=>b.date.localeCompare(a.date));show()}).catch(()=>document.getElementById('count').textContent='Archive unavailable. Please refresh.');document.getElementById('q').addEventListener('input',show);</script></body></html>

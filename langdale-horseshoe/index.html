function update(t,camera=true){progress=Math.max(0,Math.min(1,t));const v=interp(progress),future=interp(Math.min(1,progress+.009)),head=bearing(v.p,future.p);el('timeline').value=Math.round(progress*1000);el('pct').textContent=Math.round(progress*100)+'% complete';el('distance').textContent=(progress*total).toFixed(1)+' km';el('elev').textContent=v.ele===null?'—':Math.round(v.ele)+' m';el('section').textContent=progress<.12?'Leaving Great Langdale':progress<.35?'Climbing the fells':progress<.65?'High mountain traverse':progress<.87?'Across the ridge':'Returning to Langdale';if(map.getSource('done'))map.getSource('done').setData({type:'Feature',geometry:{type:'LineString',coordinates:coords.slice(0,v.i+1)}});if(map.getSource('dot'))map.getSource('dot').setData({type:'Feature',geometry:{type:'Point',coordinates:v.p}});if(camera)map.jumpTo({center:v.p,zoom:15.3,pitch:68,bearing:head});}
function loop(now){if(!playing || document.hidden)return;if(!last)last=now;const dt=Math.min(100,now-last);last=now;update(progress+dt*speed/duration);if(progress>=1){pause();return}frame=requestAnimationFrame(loop)}function pause(){playing=false;last=0;el('play').textContent='▶ Fly';if(frame)cancelAnimationFrame(frame)}function play(){if(playing){pause();return}if(progress>=1)update(0);playing=true;last=0;el('play').textContent='Ⅱ Pause';frame=requestAnimationFrame(loop)}
map.on('load',()=>{try{map.setTerrain({source:'dem',exaggeration:1.25})}catch(e){el('status').textContent='Satellite landscape · 3D terrain unavailable'};map.addSource('route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:coords}}});map.addSource('done',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:coords.slice(0,2)}}});map.addSource('dot',{type:'geojson',data:{type:'Feature',geometry:{type:'Point',coordinates:coords[0]}}});map.addLayer({id:'route-glow',type:'line',source:'route',paint:{'line-color':'#ffb65d','line-width':9,'line-opacity':.24,'line-blur':5}});map.addLayer({id:'route',type:'line',source:'route',paint:{'line-color':'#fff0c7','line-width':3,'line-opacity':.92}});map.addLayer({id:'done',type:'line',source:'done',paint:{'line-color':'#ff9c2c','line-width':5}});map.addLayer({id:'dot',type:'circle',source:'dot',paint:{'circle-radius':9,'circle-color':'#ffb04a','circle-stroke-width':3,'circle-stroke-color':'#fff'}});map.fitBounds([[Math.min(...coords.map(p=>p[0])),Math.min(...coords.map(p=>p[1]))],[Math.max(...coords.map(p=>p[0])),Math.max(...coords.map(p=>p[1]))]],{padding:65,duration:0,pitch:55});if(map.getTerrain())el('status').textContent='Satellite landscape + 3D terrain · Online';update(0,false)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('resize',()=>map.resize());map.on('error',e=>{if(e && e.error)el('status').textContent='Map tiles require internet · Try Safari'});el('play').onclick=play;el('reset').onclick=()=>{pause();update(0)};el('overview').onclick=()=>{pause();map.fitBounds([[Math.min(...coords.map(p=>p[0])),Math.min(...coords.map(p=>p[1]))],[Math.max(...coords.map(p=>p[0])),Math.max(...coords.map(p=>p[1]))]],{padding:60,duration:900,pitch:50})};el('timeline').oninput=e=>{pause();update(Number(e.target.value)/1000)};el('speed').onclick=()=>{speed=speed===1?2:speed===2?4:1;el('speed').textContent='Speed '+speed+'×'};
</script></body></html>
